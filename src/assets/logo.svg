<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dupla">
  <title>Dupla</title>
  <!-- Donut verde (hueco transparente via evenodd) -->
  <path
    fill-rule="evenodd"
    d="M 4,32 A 28,28 0 1 1 60,32 A 28,28 0 1 1 4,32 Z
       M 14,32 A 18,18 0 1 1 50,32 A 18,18 0 1 1 14,32 Z"
    fill="#0F7B5C"
  />
  <!-- Segmento coral: 12h → 4h en sentido horario (superior-derecha, ~1/3 del anillo) -->
  <path
    d="M 32,4 A 28,28 0 0 1 56.25,46 L 47.59,41 A 18,18 0 0 0 32,14 Z"
    fill="#FF6B5B"
  />
</svg>
